<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Payments | Admin | Badminton Manager Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .animate-fadeIn { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900">

    <nav class="bg-blue-600 text-white p-4 shadow-lg sticky top-0 z-50 flex items-center gap-3">
        <a href="admin.html" class="p-1 hover:bg-blue-700 rounded-full transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="font-black tracking-tight text-lg uppercase">Payments</h1>
    </nav>

    <div class="container mx-auto p-4 max-w-lg space-y-4 animate-fadeIn">
        <div class="flex justify-between items-center mb-2">
            <h2 class="text-xl font-black uppercase tracking-tight text-gray-900">Prepaid Payments</h2>
            <span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded-lg font-bold tracking-wide">PAY-INS</span>
        </div>

        <button id="record-btn" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-black uppercase tracking-wider text-xs py-3 px-4 rounded-2xl shadow-sm flex justify-center items-center gap-2 transition-all">
            <span>➕</span> Record Pay-in
        </button>

        <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm space-y-3">
            <div>
                <label class="text-[9px] font-black text-gray-400 uppercase ml-1">Search by Player</label>
                <input type="text" id="search-input" placeholder="Type a player name..."
                    class="w-full bg-gray-50 p-2.5 rounded-xl border-none ring-1 ring-gray-200 outline-none text-xs">
            </div>
            <div>
                <label class="text-[9px] font-black text-gray-400 uppercase ml-1">Status</label>
                <select id="status-select" class="w-full bg-gray-50 p-3 rounded-xl border-none ring-1 ring-gray-200 outline-none text-xs font-bold text-gray-700">
                    <option value="Active">Active (sessions left)</option>
                    <option value="Used up">Used up</option>
                    <option value="ALL">All pay-ins</option>
                </select>
            </div>
        </div>

        <p id="count-label" class="text-[10px] font-black text-gray-400 uppercase ml-1"></p>
        <div id="payments-list" class="space-y-3">
            <div class="text-center py-12 text-gray-400 font-bold uppercase text-[10px]">Loading payments...</div>
        </div>
    </div>

    <script type="module">
        import { requireAdmin } from './js/auth-guard.js';
        import { _supabase } from './js/supabase-client.js';
        import { state } from './js/state.js';
        import { logAction } from './js/audit.js';
        import { formatDateWithDay, formatTime12Hour } from './js/format.js';
        import { esc, todayStr } from './js/utils.js';

        if (!requireAdmin()) throw new Error('Not authenticated');

        // Free-text fields (reference, notes, names) go into innerHTML, so escape them.
        const money = n => '£' + Number(n).toFixed(2);
        const fmtDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };
        // Local calendar date (toISOString would give yesterday for the first hour of BST days).

        const listEl = document.getElementById('payments-list');
        const countEl = document.getElementById('count-label');
        const searchEl = document.getElementById('search-input');
        const statusEl = document.getElementById('status-select');

        let payments = [];
        let players = [];
        const openPanels = new Set(); // payment ids whose "sessions covered" panel is open

        async function loadAll() {
            const [payRes, playerRes] = await Promise.all([
                _supabase.from('player_payments')
                    .select('*, players(name), payment_registrations(id, forfeited_at)')
                    .order('paid_on', { ascending: false })
                    .order('created_at', { ascending: false }),
                _supabase.from('players').select('id, name').order('name')
            ]);

            if (payRes.error) {
                console.error('Payments fetch error:', payRes.error.message);
                listEl.innerHTML = `<div class="text-center py-12 text-red-400 font-bold text-xs">Could not load payments.<br><span class="text-[10px] text-gray-400 font-normal">Has the player payments migration been run in Supabase?</span></div>`;
                countEl.innerText = '';
                return;
            }
            payments = (payRes.data || []).map(p => {
                const used = (p.payment_registrations || []).length;
                return {
                    ...p,
                    used,
                    forfeited: (p.payment_registrations || []).filter(l => l.forfeited_at).length,
                    remaining: p.sessions_purchased - used,
                    status: used >= p.sessions_purchased ? 'Used up' : 'Active',
                    player_name: (p.players && p.players.name) || 'Unknown player'
                };
            });
            players = playerRes.data || [];
            render();
        }

        function render() {
            const q = searchEl.value.trim().toLowerCase();
            const st = statusEl.value;
            const rows = payments.filter(p =>
                (st === 'ALL' || p.status === st) &&
                (!q || p.player_name.toLowerCase().includes(q))
            );

            countEl.innerText = `${rows.length} pay-in${rows.length === 1 ? '' : 's'}`;

            if (rows.length === 0) {
                listEl.innerHTML = `<div class="text-center py-12 text-gray-400 font-bold uppercase text-[10px]">No pay-ins found</div>`;
                return;
            }

            listEl.innerHTML = rows.map(p => {
                const pct = Math.min(100, Math.round((p.used / p.sessions_purchased) * 100));
                const chip = p.status === 'Active'
                    ? 'bg-green-100 text-green-700'
                    : 'bg-gray-100 text-gray-500';
                const perSession = money(p.amount / p.sessions_purchased);
                return `
                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-4" data-card="${p.id}">
                    <div class="flex justify-between items-start gap-2">
                        <div>
                            <p class="font-black text-gray-900">${esc(p.player_name)}</p>
                            <p class="text-[10px] text-gray-400 font-bold uppercase">${money(p.amount)} · paid ${fmtDate(p.paid_on)}${p.payment_method ? ' · ' + esc(p.payment_method) : ''}</p>
                        </div>
                        <span class="text-[9px] font-black uppercase px-2 py-1 rounded-lg ${chip}">${p.status}</span>
                    </div>

                    <div class="mt-3">
                        <div class="flex justify-between text-[10px] font-black uppercase mb-1">
                            <span class="text-gray-500">${p.used} of ${p.sessions_purchased} sessions used</span>
                            <span class="text-blue-600">${p.remaining} left</span>
                        </div>
                        <div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-2 bg-blue-500 rounded-full" style="width:${pct}%"></div></div>
                        <p class="text-[10px] text-gray-400 mt-1">${perSession} per session${p.forfeited ? ` · <span class="text-red-500 font-bold">${p.forfeited} forfeited (no show / drop out)</span>` : ''}</p>
                    </div>

                    ${p.reference ? `<p class="text-[10px] text-gray-500 mt-2"><span class="font-black uppercase text-gray-400">Ref:</span> ${esc(p.reference)}</p>` : ''}
                    ${p.notes ? `<p class="text-[10px] text-gray-500 mt-1"><span class="font-black uppercase text-gray-400">Notes:</span> ${esc(p.notes)}</p>` : ''}

                    <div class="flex gap-2 mt-3">
                        <button data-action="sessions" data-id="${p.id}" class="flex-1 bg-gray-100 text-gray-700 font-black text-[10px] uppercase py-2 rounded-xl">Sessions (${p.used})</button>
                        <button data-action="edit" data-id="${p.id}" class="flex-1 bg-blue-50 text-blue-700 font-black text-[10px] uppercase py-2 rounded-xl">Edit</button>
                        ${p.used === 0 ? `<button data-action="delete" data-id="${p.id}" class="flex-1 bg-red-50 text-red-600 font-black text-[10px] uppercase py-2 rounded-xl">Delete</button>` : ''}
                    </div>

                    <div id="sessions-${p.id}" class="hidden mt-3 pt-3 border-t border-gray-100"></div>
                </div>`;
            }).join('');

            // Re-open any panels that were open before this re-render.
            openPanels.forEach(id => {
                if (document.getElementById(`sessions-${id}`)) fillSessions(id);
                else openPanels.delete(id);
            });
        }

        async function fillSessions(id) {
            const box = document.getElementById(`sessions-${id}`);
            if (!box) return;
            box.classList.remove('hidden');
            box.innerHTML = `<p class="text-center text-gray-400 text-[10px] font-bold uppercase py-2">Loading...</p>`;

            // Each row is one used credit. session_id keeps the session known even
            // after a forfeited credit's registration was removed.
            const { data, error } = await _supabase
                .from('payment_registrations')
                .select('id, forfeited_at, infraction_id, sessions(date, start_time, end_time, location, status), attendance_infractions(infraction_type, reason)')
                .eq('payment_id', id);

            if (error) {
                box.innerHTML = `<p class="text-red-400 text-[10px]">Error loading sessions.</p>`;
                return;
            }
            const rows = (data || [])
                .map(r => ({ ...r, s: r.sessions || null, inf: r.attendance_infractions || null }))
                .sort((a, b) => ((a.s ? a.s.date + (a.s.start_time || '') : '~')).localeCompare(b.s ? b.s.date + (b.s.start_time || '') : '~'));

            if (rows.length === 0) {
                box.innerHTML = `<p class="text-center text-gray-400 text-[10px] font-bold uppercase py-2">No sessions linked yet</p>`;
                return;
            }
            box.innerHTML = `<div class="space-y-1.5">` + rows.map((r, i) => {
                const s = r.s;
                const time = (s && s.start_time && s.end_time) ? `${formatTime12Hour(s.start_time)} - ${formatTime12Hour(s.end_time)}` : '';
                // Forfeited = the player was removed but the credit stayed used.
                // A linked No Show / Drop Out without forfeit = still registered.
                let badge = '';
                if (r.forfeited_at) {
                    badge = `<span class="text-[9px] font-black uppercase text-red-600 bg-red-50 px-1.5 py-0.5 rounded">Forfeited${r.inf ? ' · ' + esc(r.inf.infraction_type) : ''}</span>`;
                } else if (r.inf) {
                    badge = `<span class="text-[9px] font-black uppercase text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">${esc(r.inf.infraction_type)}</span>`;
                } else if (s && s.status === 'Cancelled') {
                    badge = `<span class="text-[9px] font-black uppercase text-red-500">Cancelled</span>`;
                }
                const reason = r.inf && r.inf.reason ? `<br><span class="text-[10px] text-gray-400 font-normal italic">${esc(r.inf.reason)}</span>` : '';
                return `
                <div class="flex justify-between items-center gap-2 bg-gray-50 rounded-xl px-3 py-2 text-[11px]">
                    <span class="font-black text-gray-400 w-5">${i + 1}.</span>
                    <span class="flex-1 text-gray-700 font-semibold">${s ? esc(formatDateWithDay(s.date)) : 'Session no longer available'}<br><span class="text-[10px] text-gray-400 font-normal">${esc(time)}${time && s && s.location ? ' · ' : ''}${esc((s && s.location) || '')}</span>${reason}</span>
                    ${badge}
                </div>`;
            }).join('') + `</div>`;
        }

        function toggleSessions(id) {
            const box = document.getElementById(`sessions-${id}`);
            if (!box) return;
            if (!box.classList.contains('hidden')) {
                box.classList.add('hidden');
                openPanels.delete(id);
                return;
            }
            openPanels.add(id);
            fillSessions(id);
        }

        // One form for both recording a new pay-in and editing an existing one.
        async function openForm(existing) {
            const isEdit = !!existing;
            const used = isEdit ? existing.used : 0;
            const inputCls = 'w-full bg-gray-50 p-3 rounded-xl border-none ring-1 ring-gray-200 outline-none text-sm';
            const labelCls = 'block text-[10px] font-black text-gray-400 uppercase mb-1 ml-1';
            const methods = ['Bank transfer', 'Cash', 'Other'];
            const currentMethod = isEdit ? (existing.payment_method || '') : 'Bank transfer';
            const methodOpts = (methods.includes(currentMethod) || !currentMethod ? methods : [...methods, currentMethod])
                .map(m => `<option value="${esc(m)}" ${m === currentMethod ? 'selected' : ''}>${esc(m)}</option>`).join('');
            const playerOpts = `<option value="">Select a player...</option>` + players.map(pl =>
                `<option value="${pl.id}" ${isEdit && existing.player_id == pl.id ? 'selected' : ''}>${esc(pl.name)}</option>`).join('');

            const result = await Swal.fire({
                title: isEdit ? 'Edit Pay-in' : 'Record Pay-in',
                html: `
                    <div class="text-left space-y-3 mt-2">
                        <div><label class="${labelCls}">Player</label>
                            <select id="pf-player" class="${inputCls}" ${isEdit ? 'disabled' : ''}>${playerOpts}</select></div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="${labelCls}">Amount (£)</label>
                                <input id="pf-amount" type="number" step="0.01" min="0.01" inputmode="decimal" class="${inputCls}" value="${isEdit ? existing.amount : ''}"></div>
                            <div><label class="${labelCls}">Sessions covered</label>
                                <input id="pf-sessions" type="number" step="1" min="${Math.max(1, used)}" inputmode="numeric" class="${inputCls}" value="${isEdit ? existing.sessions_purchased : 10}"></div>
                        </div>
                        ${isEdit && used > 0 ? `<p class="text-[10px] text-gray-400 -mt-1 ml-1">${used} session${used === 1 ? '' : 's'} already used, so it can't go below ${used}.</p>` : ''}
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="${labelCls}">Date paid</label>
                                <input id="pf-date" type="date" class="${inputCls}" value="${isEdit ? existing.paid_on : todayStr()}"></div>
                            <div><label class="${labelCls}">Method</label>
                                <select id="pf-method" class="${inputCls}">${methodOpts}</select></div>
                        </div>
                        <div><label class="${labelCls}">Reference (optional)</label>
                            <input id="pf-ref" type="text" class="${inputCls}" value="${isEdit ? esc(existing.reference || '') : ''}" placeholder="Bank reference / receipt no."></div>
                        <div><label class="${labelCls}">Notes (optional)</label>
                            <textarea id="pf-notes" rows="2" class="${inputCls}">${isEdit ? esc(existing.notes || '') : ''}</textarea></div>
                    </div>`,
                showCancelButton: true,
                confirmButtonText: isEdit ? 'Save changes' : 'Record pay-in',
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#6b7280',
                reverseButtons: true,
                customClass: {
                    popup: 'rounded-3xl',
                    confirmButton: 'rounded-xl px-6 py-3 text-sm font-bold uppercase',
                    cancelButton: 'rounded-xl px-6 py-3 text-sm font-bold uppercase'
                },
                preConfirm: () => {
                    const playerId = document.getElementById('pf-player').value;
                    const amount = parseFloat(document.getElementById('pf-amount').value);
                    const sessions = parseInt(document.getElementById('pf-sessions').value, 10);
                    const paidOn = document.getElementById('pf-date').value;
                    if (!playerId) return Swal.showValidationMessage('Please select a player');
                    if (!(amount > 0)) return Swal.showValidationMessage('Enter an amount greater than 0');
                    if (!Number.isInteger(sessions) || sessions < Math.max(1, used)) {
                        return Swal.showValidationMessage(`Sessions must be a whole number of at least ${Math.max(1, used)}`);
                    }
                    if (!paidOn) return Swal.showValidationMessage('Please choose the date paid');
                    return {
                        player_id: Number(playerId),
                        amount: Math.round(amount * 100) / 100,
                        sessions_purchased: sessions,
                        paid_on: paidOn,
                        payment_method: document.getElementById('pf-method').value || null,
                        reference: document.getElementById('pf-ref').value.trim() || null,
                        notes: document.getElementById('pf-notes').value.trim() || null
                    };
                }
            });

            if (!result.isConfirmed) return;
            const v = result.value;
            const playerName = (players.find(p => p.id == v.player_id) || {}).name || 'Unknown player';

            if (isEdit) {
                const { player_id, ...changes } = v; // player can't be changed on an existing pay-in
                const { error } = await _supabase.from('player_payments').update(changes).eq('id', existing.id);
                if (error) return Swal.fire('Error', 'Could not save changes. Please try again.', 'error');
                await logAction('PAYMENT_UPDATED',
                    `${state.adminName} updated ${playerName}'s pay-in: ${money(v.amount)} for ${v.sessions_purchased} sessions`,
                    playerName, null, existing.player_id);
            } else {
                const { error } = await _supabase.from('player_payments').insert([{ ...v, recorded_by: state.adminName }]);
                if (error) return Swal.fire('Error', 'Could not record the pay-in. Please try again.', 'error');
                await logAction('PAYMENT_RECORDED',
                    `${state.adminName} recorded a ${money(v.amount)} pay-in from ${playerName} for ${v.sessions_purchased} sessions${v.payment_method ? ' (' + v.payment_method + ')' : ''}`,
                    playerName, null, v.player_id);
            }

            Swal.fire({ toast: true, position: 'top', icon: 'success', title: isEdit ? 'Pay-in updated' : 'Pay-in recorded', showConfirmButton: false, timer: 1800 });
            await loadAll();
        }

        async function deletePayment(p) {
            const confirm = await Swal.fire({
                title: 'Delete pay-in?',
                html: `This removes <b>${esc(p.player_name)}</b>'s ${money(p.amount)} pay-in. Only do this if it was entered by mistake.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Yes, delete it',
                reverseButtons: true,
                customClass: { popup: 'rounded-3xl', confirmButton: 'rounded-xl px-6 py-3 text-sm font-bold uppercase', cancelButton: 'rounded-xl px-6 py-3 text-sm font-bold uppercase' }
            });
            if (!confirm.isConfirmed) return;

            const { error } = await _supabase.from('player_payments').delete().eq('id', p.id);
            if (error) {
                // The database refuses if sessions have been linked in the meantime.
                return Swal.fire('Cannot delete', 'This pay-in already has sessions linked to it.', 'error');
            }
            await logAction('PAYMENT_DELETED',
                `${state.adminName} deleted ${p.player_name}'s ${money(p.amount)} pay-in (${p.sessions_purchased} sessions)`,
                p.player_name, null, p.player_id);
            await loadAll();
        }

        document.getElementById('record-btn').addEventListener('click', () => openForm(null));
        searchEl.addEventListener('input', render);
        statusEl.addEventListener('change', render);

        // Click delegation: module scripts don't expose functions to inline onclick handlers.
        listEl.addEventListener('click', e => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const p = payments.find(x => x.id === btn.dataset.id);
            if (!p) return;
            if (btn.dataset.action === 'sessions') toggleSessions(p.id);
            else if (btn.dataset.action === 'edit') openForm(p);
            else if (btn.dataset.action === 'delete') deletePayment(p);
        });

        loadAll();
    </script>
</body>
</html>
