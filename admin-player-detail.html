<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Player Profile | Admin | Badminton Manager Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .chev { transition: transform 0.2s ease; }
        .is-open > .acc-head .chev,
        .is-open > .row-head .chev { transform: rotate(180deg); }
        .animate-fadeIn { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @media print {
            body * { visibility: hidden; }
            #print-only-area, #print-only-area * { visibility: visible; }
            #print-only-area { display: block !important; position: absolute; top: 0; left: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900">

    <nav class="bg-blue-600 text-white p-4 shadow-lg sticky top-0 z-50 flex items-center gap-3">
        <a href="admin-players.html" class="p-1 hover:bg-blue-700 rounded-full transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="font-black tracking-tight text-lg uppercase truncate" id="nav-title">Player Profile</h1>
    </nav>

    <div class="container mx-auto p-4 max-w-lg space-y-4">

        <div id="loading-state" class="text-center py-16 text-gray-400 font-bold uppercase text-[10px]">Loading player...</div>
        <div id="error-state" class="hidden text-center py-16 text-red-400 font-bold">Player not found.</div>

        <div id="profile-content" class="hidden space-y-4 animate-fadeIn">

            <!-- Header -->
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-5">
                <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Player</p>
                <h2 id="player-name-header" class="text-2xl font-black text-gray-900 break-words"></h2>
                <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2">
                    <p class="text-[10px] font-bold text-gray-400 uppercase">Last played: <span id="hdr-last-played" class="text-gray-700">-</span></p>
                    <p class="text-[10px] font-bold text-gray-400 uppercase">Next session: <span id="hdr-next-session" class="text-gray-700">-</span></p>
                </div>
            </div>

            <!-- Date range -->
            <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[9px] font-black text-gray-400 uppercase ml-1">From Date</label>
                        <input type="date" id="profile-from-date" class="w-full bg-gray-50 p-2.5 rounded-xl border-none ring-1 ring-gray-200 outline-none text-xs">
                    </div>
                    <div>
                        <label class="text-[9px] font-black text-gray-400 uppercase ml-1">To Date</label>
                        <input type="date" id="profile-to-date" class="w-full bg-gray-50 p-2.5 rounded-xl border-none ring-1 ring-gray-200 outline-none text-xs">
                    </div>
                </div>
                <button id="profile-clear-filters-btn" class="w-full text-[10px] font-black text-gray-400 uppercase tracking-widest py-1 hover:text-blue-600 transition-colors">
                    Clear Filters (Show All-Time)
                </button>
            </div>

            <p id="profile-range-label" class="text-[10px] font-black text-gray-400 uppercase ml-1"></p>

            <!-- Summary tiles -->
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-white border border-gray-100 p-3 rounded-2xl shadow-sm text-center">
                    <p class="text-[8px] font-bold text-gray-400 uppercase tracking-wide">Games Played</p>
                    <span id="stat-games-played" class="text-xl font-black text-blue-600">0</span>
                </div>
                <div class="bg-white border border-gray-100 p-3 rounded-2xl shadow-sm text-center">
                    <p class="text-[8px] font-bold text-gray-400 uppercase tracking-wide">Prepaid Left (all-time)</p>
                    <span id="stat-prepaid-left" class="text-xl font-black text-indigo-600">0</span>
                </div>
                <div class="bg-white border border-gray-100 p-3 rounded-2xl shadow-sm text-center">
                    <p class="text-[8px] font-bold text-gray-400 uppercase tracking-wide">Infractions</p>
                    <span id="stat-infraction-count" class="text-xl font-black text-red-500">0</span>
                </div>
                <div class="bg-white border border-gray-100 p-3 rounded-2xl shadow-sm text-center">
                    <p class="text-[8px] font-bold text-gray-400 uppercase tracking-wide">On-Time Pay %</p>
                    <span id="stat-ontime-pct" class="text-xl font-black text-green-600">0%</span>
                </div>
            </div>

            <div class="flex justify-end">
                <button id="toggle-all-btn" class="text-[10px] font-black text-blue-600 uppercase tracking-widest">Expand all sections</button>
            </div>

            <!-- Upcoming -->
            <section class="acc is-open bg-white rounded-3xl border border-gray-100 shadow-sm" data-acc="upcoming">
                <button type="button" class="acc-head w-full flex justify-between items-center p-4 text-left" data-acc-toggle="upcoming" aria-expanded="true">
                    <span class="flex items-center gap-2">
                        <span class="text-xs font-black text-gray-700 uppercase">Upcoming Sessions</span>
                        <span id="badge-upcoming" class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">0</span>
                    </span>
                    <svg class="chev w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="body-upcoming" class="acc-body px-4 pb-4"><div id="upcoming-sessions-list" class="divide-y divide-gray-50"></div></div>
            </section>

            <!-- Sessions played -->
            <section class="acc bg-white rounded-3xl border border-gray-100 shadow-sm" data-acc="sessions">
                <button type="button" class="acc-head w-full flex justify-between items-center p-4 text-left" data-acc-toggle="sessions" aria-expanded="false">
                    <span class="flex items-center gap-2">
                        <span class="text-xs font-black text-gray-700 uppercase">Sessions Played</span>
                        <span id="badge-sessions" class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">0</span>
                    </span>
                    <svg class="chev w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="body-sessions" class="acc-body hidden px-4 pb-4">
                    <p class="text-[10px] text-gray-400 mb-1">Tap a session to see payment, prepaid, infractions and activity.</p>
                    <div id="sessions-list" class="divide-y divide-gray-50"></div>
                    <button id="sessions-more-btn" class="hidden w-full mt-3 bg-gray-100 text-gray-600 font-black text-[10px] uppercase py-2.5 rounded-xl">Show more</button>
                </div>
            </section>

            <!-- Payments -->
            <section class="acc bg-white rounded-3xl border border-gray-100 shadow-sm" data-acc="payments">
                <button type="button" class="acc-head w-full flex justify-between items-center p-4 text-left" data-acc-toggle="payments" aria-expanded="false">
                    <span class="flex items-center gap-2">
                        <span class="text-xs font-black text-gray-700 uppercase">Payments</span>
                        <span id="badge-payments" class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">0</span>
                    </span>
                    <svg class="chev w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="body-payments" class="acc-body hidden px-4 pb-4">
                    <div id="payments-summary" class="mb-3"></div>
                    <div id="payments-list" class="space-y-3"></div>
                    <a href="admin-payments.html" class="block text-center text-[10px] font-black text-blue-600 uppercase mt-3">Manage all payments →</a>
                </div>
            </section>

            <!-- Infractions -->
            <section class="acc bg-white rounded-3xl border border-gray-100 shadow-sm" data-acc="infractions">
                <button type="button" class="acc-head w-full flex justify-between items-center p-4 text-left" data-acc-toggle="infractions" aria-expanded="false">
                    <span class="flex items-center gap-2">
                        <span class="text-xs font-black text-gray-700 uppercase">Infraction History</span>
                        <span id="badge-infractions" class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">0</span>
                    </span>
                    <svg class="chev w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="body-infractions" class="acc-body hidden px-4 pb-4"><div id="infractions-list" class="divide-y divide-gray-50"></div></div>
            </section>

            <!-- Notes -->
            <section class="acc bg-white rounded-3xl border border-gray-100 shadow-sm" data-acc="notes">
                <button type="button" class="acc-head w-full flex justify-between items-center p-4 text-left" data-acc-toggle="notes" aria-expanded="false">
                    <span class="flex items-center gap-2">
                        <span class="text-xs font-black text-gray-700 uppercase">Notes</span>
                        <span id="badge-notes" class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">0</span>
                    </span>
                    <svg class="chev w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="body-notes" class="acc-body hidden px-4 pb-4">
                    <div id="profile-notes-list" class="space-y-2 max-h-56 overflow-y-auto pr-1"></div>
                    <a id="manage-notes-link" href="#" class="block text-center text-[10px] font-black text-blue-600 uppercase mt-3">Manage Notes →</a>
                </div>
            </section>

            <!-- Activity -->
            <section class="acc bg-white rounded-3xl border border-gray-100 shadow-sm" data-acc="activity">
                <button type="button" class="acc-head w-full flex justify-between items-center p-4 text-left" data-acc-toggle="activity" aria-expanded="false">
                    <span class="flex items-center gap-2">
                        <span class="text-xs font-black text-gray-700 uppercase">Activity</span>
                        <span id="badge-activity" class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">0</span>
                    </span>
                    <svg class="chev w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="body-activity" class="acc-body hidden px-4 pb-4">
                    <select id="activity-action-select" class="w-full bg-gray-50 p-2.5 rounded-xl border-none ring-1 ring-gray-200 outline-none text-xs font-bold text-gray-700 mb-3">
                        <option value="ALL">All actions</option>
                    </select>
                    <div id="activity-list" class="space-y-2"></div>
                    <button id="activity-more-btn" class="hidden w-full mt-3 bg-gray-100 text-gray-600 font-black text-[10px] uppercase py-2.5 rounded-xl">Show more</button>
                </div>
            </section>

            <div class="grid grid-cols-2 gap-3">
                <button id="export-csv-btn" class="w-full bg-gray-100 text-gray-700 font-black py-3 rounded-2xl uppercase tracking-widest text-[11px]">
                    Export CSV
                </button>
                <button id="export-print-btn" class="w-full bg-gray-900 text-white font-black py-3 rounded-2xl uppercase tracking-widest text-[11px]">
                    Print
                </button>
            </div>
        </div>
    </div>

    <div id="print-only-area" class="hidden"></div>

    <script type="module">
        import { requireAdmin } from './js/auth-guard.js';
        import { _supabase } from './js/supabase-client.js';
        import { formatDateWithDay, formatTime12Hour } from './js/format.js';

        if (!requireAdmin()) throw new Error('Not authenticated');

        // ---------------------------------------------------------------
        // Helpers
        // ---------------------------------------------------------------
        // Names, reasons, notes and audit details are free text and are put
        // into innerHTML, so they are always escaped.
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const money = n => '£' + Number(n || 0).toFixed(2);
        const fmtDate = d => { if (!d) return ''; const [y, m, dd] = String(d).split('T')[0].split('-'); return `${dd}/${m}/${y}`; };
        const fmtDateTime = d => new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        const todayLocal = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
        const timeRange = (s, e) => (s && e) ? `${formatTime12Hour(s)} - ${formatTime12Hour(e)}` : 'N/A';
        const sessionSortKey = s => s ? `${s.date || ''}|${(s.start_time || '').slice(0, 5)}` : '~';

        const PAGE_SIZE = 20;

        // ---------------------------------------------------------------
        // Raw data (fetched once) and lookups built from it
        // ---------------------------------------------------------------
        let currentPlayerName = '';
        let allSessionRows = [];
        let allInfractionRows = [];
        let allUpcomingRows = [];
        let allPayments = [];
        let allActivity = [];
        let paymentsLoaded = true;

        let regBySession = new Map();      // session_id -> this player's registration
        let linkBySession = new Map();     // session_id -> { payment, link, ordinal }
        let infBySession = new Map();      // session_id -> [infraction rows]
        let activityBySession = new Map(); // session_id -> [audit rows]

        // UI state
        const openRows = new Set();
        let sessionsShown = PAGE_SIZE;
        let activityShown = PAGE_SIZE;

        // Mirrors what is rendered (respects the date filter) so exports match the screen.
        let lastSessionRows = [];
        let lastInfractionRows = [];
        let lastPaymentRows = [];
        let lastActivityRows = [];
        let lastStats = { gamesPlayed: 0, infractionCount: 0, onTimePct: 0, prepaidLeft: 0 };

        function showError() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
        }

        function getDateBounds() {
            const fromVal = document.getElementById('profile-from-date').value;
            const toVal = document.getElementById('profile-to-date').value;
            return {
                startBound: fromVal ? new Date(fromVal).setHours(0, 0, 0, 0) : null,
                endBound: toVal ? new Date(toVal).setHours(23, 59, 59, 999) : null
            };
        }

        function withinBounds(dateStr, startBound, endBound) {
            const t = new Date(dateStr).getTime();
            if (startBound && t < startBound) return false;
            if (endBound && t > endBound) return false;
            return true;
        }

        function pushTo(map, key, row) {
            const k = String(key);
            if (!map.has(k)) map.set(k, []);
            map.get(k).push(row);
        }

        function buildLookups() {
            regBySession = new Map();
            allUpcomingRows.forEach(r => { if (r.session_id) regBySession.set(String(r.session_id), r.reg); });
            allSessionRows.forEach(h => { if (h.session_id && h.reg && !regBySession.has(String(h.session_id))) regBySession.set(String(h.session_id), h.reg); });

            linkBySession = new Map();
            allPayments.forEach(p => {
                const links = (p.payment_registrations || []).slice().sort((a, b) => sessionSortKey(a.sessions).localeCompare(sessionSortKey(b.sessions)));
                links.forEach((l, i) => {
                    let sid = l.sessions && l.sessions.id;
                    if (!sid && l.registration_id) {
                        const match = [...regBySession.entries()].find(([, reg]) => reg && reg.id == l.registration_id);
                        if (match) sid = match[0];
                    }
                    if (sid) linkBySession.set(String(sid), { payment: p, link: l, ordinal: i + 1 });
                });
            });

            infBySession = new Map();
            allInfractionRows.forEach(r => { if (r.session_id) pushTo(infBySession, r.session_id, r); });

            activityBySession = new Map();
            allActivity.forEach(a => { if (a.session_info) pushTo(activityBySession, a.session_info, a); });
        }

        // ---------------------------------------------------------------
        // Badges / chips
        // ---------------------------------------------------------------
        function infractionBadge(type) {
            if (type === 'Late Payment') return { style: 'bg-amber-50 text-amber-700 border-amber-200', icon: '⏰' };
            if (type === 'No Show' || type === 'Drop Out') return { style: 'bg-red-50 text-red-700 border-red-200', icon: '❌' };
            if (type === 'On Time Payment') return { style: 'bg-green-50 text-green-700 border-green-200', icon: '⚡' };
            return { style: 'bg-gray-100 text-gray-700 border-gray-200', icon: '📋' };
        }

        function chip(text, style) {
            return `<span class="text-[8px] font-black border uppercase px-2 py-0.5 rounded-md ${style}">${esc(text)}</span>`;
        }

        function actionStyle(action) {
            const a = String(action || '');
            if (a.includes('PAID')) return 'text-green-600';
            if (a.includes('REMOVED') || a.includes('CANCEL')) return 'text-red-500';
            if (a.includes('JOINED') || a.includes('PROMOTED')) return 'text-blue-600';
            return 'text-gray-500';
        }

        // ---------------------------------------------------------------
        // Expandable session rows (used by Upcoming and Sessions Played)
        // ---------------------------------------------------------------
        function sessionChips(item) {
            const out = [];
            if (item.regStatus) {
                out.push(item.regStatus === 'Waitlist'
                    ? chip('Waitlist', 'bg-orange-50 text-orange-600 border-orange-200')
                    : chip('Confirmed', 'bg-green-50 text-green-600 border-green-200'));
            }
            if (item.sessionStatus === 'Cancelled') out.push(chip('Cancelled', 'bg-red-50 text-red-600 border-red-200'));
            const reg = regBySession.get(String(item.sid));
            if (reg) {
                out.push(reg.payment_status === 'Paid'
                    ? chip('Paid', 'bg-green-50 text-green-700 border-green-200')
                    : chip('Unpaid', 'bg-amber-50 text-amber-700 border-amber-200'));
            }
            const link = linkBySession.get(String(item.sid));
            if (link) {
                out.push(link.link.forfeited_at
                    ? chip('Forfeited', 'bg-red-50 text-red-600 border-red-200')
                    : chip(`Prepaid ${link.ordinal}/${link.payment.sessions_purchased}`, 'bg-indigo-50 text-indigo-600 border-indigo-200'));
            }
            (infBySession.get(String(item.sid)) || [])
                .filter(r => r.infraction_type !== 'On Time Payment')
                .forEach(r => { const b = infractionBadge(r.infraction_type); out.push(chip(r.infraction_type, b.style)); });
            return out.join('');
        }

        function detailLine(label, value) {
            return `<div class="flex justify-between gap-3 text-[11px]"><span class="font-black text-gray-400 uppercase text-[9px] pt-0.5">${esc(label)}</span><span class="text-gray-700 font-semibold text-right">${value}</span></div>`;
        }

        function sessionDetail(item) {
            const sid = String(item.sid);
            const reg = regBySession.get(sid);
            const link = linkBySession.get(sid);
            const infs = infBySession.get(sid) || [];
            const logs = activityBySession.get(sid) || [];

            let html = '<div class="space-y-2">';
            if (item.sessionStatus) html += detailLine('Session', esc(item.sessionStatus));
            html += detailLine('Registration', esc(reg ? reg.status : (item.regStatus || 'No record')));
            html += detailLine('Payment', esc(reg ? (reg.payment_status || 'Unpaid') : 'No record'));
            html += detailLine('Prepaid', link
                ? `Session ${link.ordinal} of ${link.payment.sessions_purchased}<br><span class="text-[10px] text-gray-400 font-normal">${money(link.payment.amount)} pay-in, ${fmtDate(link.payment.paid_on)}${link.link.forfeited_at ? ' · <span class="text-red-500 font-bold">forfeited</span>' : ''}</span>`
                : 'Not prepaid');

            if (infs.length) {
                html += `<div class="pt-1"><p class="text-[9px] font-black text-gray-400 uppercase mb-1">Infractions</p>` + infs.map(r => {
                    const b = infractionBadge(r.infraction_type);
                    return `<div class="mb-1"><span class="text-[9px] font-black border uppercase px-2 py-0.5 rounded-md ${b.style}">${b.icon} ${esc(r.infraction_type)}</span>${r.reason ? `<p class="text-[10px] text-gray-500 italic mt-0.5">"${esc(r.reason)}"</p>` : ''}</div>`;
                }).join('') + `</div>`;
            }

            if (logs.length) {
                const shown = logs.slice(0, 5);
                html += `<div class="pt-1"><p class="text-[9px] font-black text-gray-400 uppercase mb-1">Activity</p>` + shown.map(a => `
                    <div class="bg-white rounded-lg p-2 mb-1 border border-gray-100">
                        <div class="flex justify-between"><span class="text-[9px] font-black uppercase ${actionStyle(a.action)}">${esc(String(a.action).replace(/_/g, ' '))}</span><span class="text-[9px] text-gray-300">${esc(fmtDateTime(a.created_at))}</span></div>
                        <p class="text-[10px] text-gray-600 leading-tight">${esc(a.details)}</p>
                    </div>`).join('') +
                    (logs.length > shown.length ? `<p class="text-[9px] text-gray-400">+${logs.length - shown.length} more in the Activity section</p>` : '') + `</div>`;
            }
            return html + '</div>';
        }

        function sessionRowHtml(item) {
            const open = openRows.has(item.key);
            return `
                <div class="${open ? 'is-open' : ''} py-1" data-row="${esc(item.key)}">
                    <button type="button" class="row-head w-full flex justify-between items-center py-2 text-left" data-row-toggle="${esc(item.key)}" aria-expanded="${open}">
                        <div class="min-w-0">
                            <div class="flex flex-wrap items-center gap-1 mb-1">${sessionChips(item)}</div>
                            <p class="text-[10px] font-black text-blue-600 uppercase leading-none">${esc(formatDateWithDay(item.date))}</p>
                            <p class="font-bold text-gray-800 text-sm mt-1">${esc(item.time)}</p>
                        </div>
                        <div class="flex items-center gap-2 pl-2 flex-shrink-0">
                            <span class="text-[9px] font-bold text-gray-400 uppercase text-right max-w-[100px] truncate">${esc(item.location)}</span>
                            <svg class="chev w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </button>
                    <div class="row-detail ${open ? '' : 'hidden'} bg-gray-50 rounded-xl p-3 mb-2">${sessionDetail(item)}</div>
                </div>`;
        }

        function renderUpcoming() {
            const container = document.getElementById('upcoming-sessions-list');
            document.getElementById('badge-upcoming').innerText = allUpcomingRows.length;
            if (allUpcomingRows.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 italic py-6 text-xs">No upcoming sessions.</p>`;
                return;
            }
            container.innerHTML = allUpcomingRows.map(r => sessionRowHtml({
                key: `up:${r.session_id}`,
                sid: r.session_id,
                date: r.session_date,
                time: timeRange(r.start_time, r.end_time),
                location: r.session_location,
                regStatus: r.status,
                sessionStatus: r.session_status
            })).join('');
        }

        function renderSessions(records) {
            const container = document.getElementById('sessions-list');
            const moreBtn = document.getElementById('sessions-more-btn');
            document.getElementById('badge-sessions').innerText = records.length;

            if (records.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 italic py-6 text-xs">No completed sessions in this range.</p>`;
                moreBtn.classList.add('hidden');
                return;
            }
            const visible = records.slice(0, sessionsShown);
            container.innerHTML = visible.map((h, i) => sessionRowHtml({
                key: `past:${h.session_id || i}`,
                sid: h.session_id,
                date: h.session_date,
                time: h.session_time,
                location: h.session_location,
                regStatus: null,
                sessionStatus: null
            })).join('');

            const remaining = records.length - visible.length;
            moreBtn.classList.toggle('hidden', remaining <= 0);
            moreBtn.innerText = `Show ${Math.min(PAGE_SIZE, remaining)} more (${remaining} left)`;
        }

        // ---------------------------------------------------------------
        // Payments
        // ---------------------------------------------------------------
        function paymentStats(p) {
            const links = p.payment_registrations || [];
            const used = links.length;
            return {
                used,
                forfeited: links.filter(l => l.forfeited_at).length,
                remaining: p.sessions_purchased - used,
                active: used < p.sessions_purchased
            };
        }

        function renderPayments(records) {
            const list = document.getElementById('payments-list');
            const summary = document.getElementById('payments-summary');
            document.getElementById('badge-payments').innerText = records.length;

            if (!paymentsLoaded) {
                summary.innerHTML = '';
                list.innerHTML = `<p class="text-center text-red-400 text-xs font-bold py-4">Could not load payments.<br><span class="text-[10px] text-gray-400 font-normal">Has the player payments migration been run in Supabase?</span></p>`;
                return;
            }

            const totalPaid = records.reduce((sum, p) => sum + Number(p.amount || 0), 0);
            summary.innerHTML = `
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-gray-50 rounded-xl p-2"><p class="text-[8px] font-bold text-gray-400 uppercase">Pay-ins</p><p class="text-sm font-black text-gray-800">${records.length}</p></div>
                    <div class="bg-gray-50 rounded-xl p-2"><p class="text-[8px] font-bold text-gray-400 uppercase">Total Paid</p><p class="text-sm font-black text-gray-800">${money(totalPaid)}</p></div>
                    <div class="bg-gray-50 rounded-xl p-2"><p class="text-[8px] font-bold text-gray-400 uppercase">Left (all-time)</p><p class="text-sm font-black text-indigo-600">${lastStats.prepaidLeft}</p></div>
                </div>`;

            if (records.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-400 italic py-4 text-xs">No pay-ins recorded in this range.</p>`;
                return;
            }

            list.innerHTML = records.map(p => {
                const st = paymentStats(p);
                const pct = Math.min(100, Math.round((st.used / p.sessions_purchased) * 100));
                const chipStyle = st.active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500';
                return `
                    <div class="border border-gray-100 rounded-2xl p-3">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <p class="font-black text-gray-900 text-sm">${money(p.amount)} · ${p.sessions_purchased} sessions</p>
                                <p class="text-[10px] text-gray-400 font-bold uppercase">Paid ${esc(fmtDate(p.paid_on))}${p.payment_method ? ' · ' + esc(p.payment_method) : ''}</p>
                            </div>
                            <span class="text-[9px] font-black uppercase px-2 py-1 rounded-lg ${chipStyle}">${st.active ? 'Active' : 'Used up'}</span>
                        </div>
                        <div class="mt-3">
                            <div class="flex justify-between text-[10px] font-black uppercase mb-1">
                                <span class="text-gray-500">${st.used} of ${p.sessions_purchased} used</span>
                                <span class="text-blue-600">${st.remaining} left</span>
                            </div>
                            <div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-2 bg-blue-500 rounded-full" style="width:${pct}%"></div></div>
                            <p class="text-[10px] text-gray-400 mt-1">${money(p.amount / p.sessions_purchased)} per session${st.forfeited ? ` · <span class="text-red-500 font-bold">${st.forfeited} forfeited</span>` : ''}</p>
                        </div>
                        ${p.reference ? `<p class="text-[10px] text-gray-500 mt-2"><span class="font-black uppercase text-gray-400">Ref:</span> ${esc(p.reference)}</p>` : ''}
                        ${p.notes ? `<p class="text-[10px] text-gray-500 mt-1"><span class="font-black uppercase text-gray-400">Notes:</span> ${esc(p.notes)}</p>` : ''}
                        <button type="button" data-pay-sessions="${esc(p.id)}" class="w-full mt-3 bg-gray-100 text-gray-700 font-black text-[10px] uppercase py-2 rounded-xl">Sessions covered (${st.used})</button>
                        <div id="pay-sessions-${esc(p.id)}" class="hidden mt-2 space-y-1.5">${paymentSessionsHtml(p)}</div>
                    </div>`;
            }).join('');
        }

        function paymentSessionsHtml(p) {
            const links = (p.payment_registrations || []).slice().sort((a, b) => sessionSortKey(a.sessions).localeCompare(sessionSortKey(b.sessions)));
            if (links.length === 0) return `<p class="text-center text-gray-400 text-[10px] font-bold uppercase py-2">No sessions linked yet</p>`;
            return links.map((l, i) => {
                const s = l.sessions;
                const inf = l.attendance_infractions;
                let badge = '';
                if (l.forfeited_at) badge = `<span class="text-[9px] font-black uppercase text-red-600 bg-red-50 px-1.5 py-0.5 rounded">Forfeited${inf ? ' · ' + esc(inf.infraction_type) : ''}</span>`;
                else if (inf) badge = `<span class="text-[9px] font-black uppercase text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">${esc(inf.infraction_type)}</span>`;
                else if (s && s.status === 'Cancelled') badge = `<span class="text-[9px] font-black uppercase text-red-500">Cancelled</span>`;
                return `
                    <div class="flex justify-between items-center gap-2 bg-gray-50 rounded-xl px-3 py-2 text-[11px]">
                        <span class="font-black text-gray-400 w-5">${i + 1}.</span>
                        <span class="flex-1 text-gray-700 font-semibold">${s ? esc(formatDateWithDay(s.date)) : 'Session no longer available'}<br><span class="text-[10px] text-gray-400 font-normal">${s ? esc(timeRange(s.start_time, s.end_time)) + (s.location ? ' · ' + esc(s.location) : '') : ''}</span>${inf && inf.reason ? `<br><span class="text-[10px] text-gray-400 font-normal italic">${esc(inf.reason)}</span>` : ''}</span>
                        ${badge}
                    </div>`;
            }).join('');
        }

        // ---------------------------------------------------------------
        // Infractions, notes, activity
        // ---------------------------------------------------------------
        function renderInfractions(records) {
            const container = document.getElementById('infractions-list');
            document.getElementById('badge-infractions').innerText = records.length;
            if (records.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 italic py-6 text-xs">No infractions recorded in this range.</p>`;
                return;
            }
            container.innerHTML = records.map(r => {
                const badge = infractionBadge(r.infraction_type);
                return `
                    <div class="py-3">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[9px] font-black border uppercase px-2 py-0.5 rounded-md ${badge.style}">${badge.icon} ${esc(r.infraction_type)}</span>
                            <span class="text-[10px] text-gray-400 font-bold">${esc(formatDateWithDay(r.session_date))}</span>
                        </div>
                        <p class="text-xs text-gray-500 italic">"${esc(r.reason || 'No additional details provided.')}"</p>
                    </div>`;
            }).join('');
        }

        function renderProfileNotes(notes) {
            const container = document.getElementById('profile-notes-list');
            document.getElementById('badge-notes').innerText = notes.length;
            if (notes.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 italic py-4 text-xs">No notes yet.</p>`;
                return;
            }
            container.innerHTML = notes.map(n => `
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-100 text-xs">
                    <p class="text-gray-700 mb-1">${esc(n.note_text)}</p>
                    <p class="text-[9px] font-bold text-gray-400 uppercase">${esc(n.created_by || 'Admin')} · ${esc(new Date(n.created_at).toLocaleDateString('en-GB'))}</p>
                </div>`).join('');
        }

        function populateActivityActions() {
            const select = document.getElementById('activity-action-select');
            const current = select.value;
            const actions = [...new Set(allActivity.map(a => a.action))].sort();
            select.innerHTML = `<option value="ALL">All actions</option>` +
                actions.map(a => `<option value="${esc(a)}">${esc(String(a).replace(/_/g, ' '))}</option>`).join('');
            if (actions.includes(current)) select.value = current;
        }

        function renderActivity(records) {
            const container = document.getElementById('activity-list');
            const moreBtn = document.getElementById('activity-more-btn');
            document.getElementById('badge-activity').innerText = records.length;

            if (records.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 italic py-6 text-xs">No activity recorded in this range.</p>`;
                moreBtn.classList.add('hidden');
                return;
            }
            const visible = records.slice(0, activityShown);
            container.innerHTML = visible.map(a => `
                <div class="bg-gray-50 p-2.5 rounded-xl text-[10px] border border-gray-100">
                    <div class="flex justify-between mb-1 gap-2">
                        <span class="font-black uppercase ${actionStyle(a.action)}">${esc(String(a.action).replace(/_/g, ' '))}</span>
                        <span class="text-gray-300 flex-shrink-0">${esc(fmtDateTime(a.created_at))}</span>
                    </div>
                    <p class="text-gray-600 leading-tight">${esc(a.details)}</p>
                </div>`).join('');

            const remaining = records.length - visible.length;
            moreBtn.classList.toggle('hidden', remaining <= 0);
            moreBtn.innerText = `Show ${Math.min(PAGE_SIZE, remaining)} more (${remaining} left)`;
        }

        // ---------------------------------------------------------------
        // Recompute everything that depends on the filters
        // ---------------------------------------------------------------
        function recomputeAndRender() {
            const { startBound, endBound } = getDateBounds();
            const actionFilter = document.getElementById('activity-action-select').value;

            document.getElementById('profile-range-label').innerText = (startBound || endBound)
                ? 'Showing filtered date range'
                : 'Showing all-time totals';

            const sessionRows = allSessionRows.filter(h => withinBounds(h.session_date, startBound, endBound));
            const infractionRows = allInfractionRows.filter(r => withinBounds(r.session_date, startBound, endBound));
            const paymentRows = allPayments.filter(p => withinBounds(p.paid_on, startBound, endBound));
            const activityRows = allActivity.filter(a => withinBounds(a.created_at, startBound, endBound) && (actionFilter === 'ALL' || a.action === actionFilter));

            const paymentRecords = infractionRows.filter(r => r.infraction_type === 'On Time Payment' || r.infraction_type === 'Late Payment');
            const onTimeCount = infractionRows.filter(r => r.infraction_type === 'On Time Payment').length;
            const onTimePct = paymentRecords.length > 0 ? Math.round((onTimeCount / paymentRecords.length) * 100) : 0;
            const prepaidLeft = allPayments.reduce((sum, p) => sum + Math.max(0, paymentStats(p).remaining), 0);

            document.getElementById('stat-games-played').innerText = sessionRows.length;
            document.getElementById('stat-infraction-count').innerText = infractionRows.length;
            document.getElementById('stat-ontime-pct').innerText = `${onTimePct}%`;
            document.getElementById('stat-prepaid-left').innerText = prepaidLeft;

            lastSessionRows = sessionRows;
            lastInfractionRows = infractionRows;
            lastPaymentRows = paymentRows;
            lastActivityRows = activityRows;
            lastStats = { gamesPlayed: sessionRows.length, infractionCount: infractionRows.length, onTimePct, prepaidLeft };

            renderSessions(sessionRows);
            renderPayments(paymentRows);
            renderInfractions(infractionRows);
            renderActivity(activityRows);
        }

        // ---------------------------------------------------------------
        // Accordion + row expand (event delegation)
        // ---------------------------------------------------------------
        function setAccordion(name, open) {
            const sec = document.querySelector(`[data-acc="${name}"]`);
            const body = document.getElementById(`body-${name}`);
            if (!sec || !body) return;
            sec.classList.toggle('is-open', open);
            body.classList.toggle('hidden', !open);
            sec.querySelector('[data-acc-toggle]').setAttribute('aria-expanded', String(open));
        }

        function updateToggleAllLabel() {
            const sections = [...document.querySelectorAll('[data-acc]')];
            const allOpen = sections.every(s => s.classList.contains('is-open'));
            document.getElementById('toggle-all-btn').innerText = allOpen ? 'Collapse all sections' : 'Expand all sections';
        }

        document.addEventListener('click', e => {
            const accBtn = e.target.closest('[data-acc-toggle]');
            if (accBtn) {
                const name = accBtn.getAttribute('data-acc-toggle');
                setAccordion(name, !document.querySelector(`[data-acc="${name}"]`).classList.contains('is-open'));
                updateToggleAllLabel();
                return;
            }

            const rowBtn = e.target.closest('[data-row-toggle]');
            if (rowBtn) {
                const key = rowBtn.getAttribute('data-row-toggle');
                const wrap = rowBtn.parentElement;
                const nowOpen = !openRows.has(key);
                if (nowOpen) openRows.add(key); else openRows.delete(key);
                wrap.classList.toggle('is-open', nowOpen);
                wrap.querySelector('.row-detail').classList.toggle('hidden', !nowOpen);
                rowBtn.setAttribute('aria-expanded', String(nowOpen));
                return;
            }

            const payBtn = e.target.closest('[data-pay-sessions]');
            if (payBtn) {
                const panel = document.getElementById(`pay-sessions-${payBtn.getAttribute('data-pay-sessions')}`);
                if (panel) panel.classList.toggle('hidden');
            }
        });

        document.getElementById('toggle-all-btn').addEventListener('click', () => {
            const sections = [...document.querySelectorAll('[data-acc]')];
            const open = !sections.every(s => s.classList.contains('is-open'));
            sections.forEach(s => setAccordion(s.getAttribute('data-acc'), open));
            updateToggleAllLabel();
        });

        document.getElementById('sessions-more-btn').addEventListener('click', () => { sessionsShown += PAGE_SIZE; renderSessions(lastSessionRows); });
        document.getElementById('activity-more-btn').addEventListener('click', () => { activityShown += PAGE_SIZE; renderActivity(lastActivityRows); });
        document.getElementById('activity-action-select').addEventListener('change', () => { activityShown = PAGE_SIZE; recomputeAndRender(); });

        function onFilterChange() { sessionsShown = PAGE_SIZE; activityShown = PAGE_SIZE; recomputeAndRender(); }
        document.getElementById('profile-from-date').addEventListener('change', onFilterChange);
        document.getElementById('profile-to-date').addEventListener('change', onFilterChange);
        document.getElementById('profile-clear-filters-btn').addEventListener('click', () => {
            document.getElementById('profile-from-date').value = '';
            document.getElementById('profile-to-date').value = '';
            onFilterChange();
        });

        // ---------------------------------------------------------------
        // Export: CSV
        // ---------------------------------------------------------------
        function escapeCsvCell(val) {
            const str = String(val ?? '');
            if (/[",\n]/.test(str)) return `"${str.replace(/"/g, '""')}"`;
            return str;
        }

        function downloadCsv(filename, content) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function sessionPaymentText(sid) {
            const reg = sid ? regBySession.get(String(sid)) : null;
            const link = sid ? linkBySession.get(String(sid)) : null;
            return {
                payment: reg ? (reg.payment_status || 'Unpaid') : '',
                prepaid: link ? `${link.ordinal} of ${link.payment.sessions_purchased}${link.link.forfeited_at ? ' (forfeited)' : ''}` : ''
            };
        }

        function exportProfileCsv() {
            const lines = [];
            const row = cells => lines.push(cells.map(escapeCsvCell).join(','));

            row([`Player Report: ${currentPlayerName}`]);
            row([`Generated: ${new Date().toLocaleString()}`]);
            lines.push('');

            lines.push('Summary');
            row(['Games Played', 'Infractions', 'On-Time Payment %', 'Prepaid Sessions Left']);
            row([lastStats.gamesPlayed, lastStats.infractionCount, `${lastStats.onTimePct}%`, lastStats.prepaidLeft]);
            lines.push('');

            lines.push('Upcoming Sessions');
            row(['Date', 'Time', 'Location', 'Registration', 'Payment', 'Prepaid']);
            if (allUpcomingRows.length === 0) lines.push('(none)');
            allUpcomingRows.forEach(r => {
                const m = sessionPaymentText(r.session_id);
                row([formatDateWithDay(r.session_date), timeRange(r.start_time, r.end_time), r.session_location, r.status, m.payment, m.prepaid]);
            });
            lines.push('');

            lines.push('Sessions Played');
            row(['Date', 'Time', 'Location', 'Payment', 'Prepaid']);
            if (lastSessionRows.length === 0) lines.push('(none in this range)');
            lastSessionRows.forEach(h => {
                const m = sessionPaymentText(h.session_id);
                row([formatDateWithDay(h.session_date), h.session_time, h.session_location, m.payment, m.prepaid]);
            });
            lines.push('');

            lines.push('Payments');
            row(['Paid On', 'Amount', 'Sessions Purchased', 'Used', 'Remaining', 'Forfeited', 'Method', 'Reference']);
            if (lastPaymentRows.length === 0) lines.push('(none in this range)');
            lastPaymentRows.forEach(p => {
                const st = paymentStats(p);
                row([fmtDate(p.paid_on), Number(p.amount || 0).toFixed(2), p.sessions_purchased, st.used, st.remaining, st.forfeited, p.payment_method || '', p.reference || '']);
            });
            lines.push('');

            lines.push('Infraction History');
            row(['Date', 'Type', 'Reason']);
            if (lastInfractionRows.length === 0) lines.push('(none in this range)');
            lastInfractionRows.forEach(r => row([formatDateWithDay(r.session_date), r.infraction_type, r.reason || '']));
            lines.push('');

            lines.push('Activity');
            row(['When', 'Action', 'Details']);
            if (lastActivityRows.length === 0) lines.push('(none in this range)');
            lastActivityRows.forEach(a => row([fmtDateTime(a.created_at), String(a.action).replace(/_/g, ' '), a.details || '']));

            const fileSafeName = currentPlayerName.replace(/[^a-z0-9]/gi, '_');
            downloadCsv(`player-report_${fileSafeName}.csv`, lines.join('\n'));
        }

        // ---------------------------------------------------------------
        // Export: Print
        // ---------------------------------------------------------------
        const TH = 'text-align:left;padding:6px;border-bottom:2px solid #111;';
        const TD = 'padding:6px;border-bottom:1px solid #e5e7eb;';

        function printTable(title, headers, rows, emptyText) {
            const body = rows.length === 0
                ? `<tr><td colspan="${headers.length}" style="padding:8px;color:#999;">${esc(emptyText)}</td></tr>`
                : rows.map(cells => `<tr>${cells.map(c => `<td style="${TD}">${esc(c)}</td>`).join('')}</tr>`).join('');
            return `
                <h2 style="font-size:14px;margin-bottom:8px;">${esc(title)}</h2>
                <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:24px;">
                    <thead><tr>${headers.map(h => `<th style="${TH}">${esc(h)}</th>`).join('')}</tr></thead>
                    <tbody>${body}</tbody>
                </table>`;
        }

        async function exportProfilePrint() {
            const opt = (id, label) => `
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" id="${id}" checked class="w-4 h-4 accent-blue-600">
                    <span class="font-medium">${label}</span>
                </label>`;

            const { value: selections, isConfirmed } = await Swal.fire({
                title: 'Choose Sections to Print',
                html: `<div class="text-left space-y-3 text-sm">
                    ${opt('print-summary', 'Summary Stats')}
                    ${opt('print-upcoming', 'Upcoming Sessions')}
                    ${opt('print-sessions', 'Sessions Played')}
                    ${opt('print-payments', 'Payments')}
                    ${opt('print-infractions', 'Infraction History')}
                    ${opt('print-activity', 'Activity')}
                </div>`,
                showCancelButton: true,
                confirmButtonText: 'Print',
                confirmButtonColor: '#111827',
                customClass: { popup: 'rounded-3xl' },
                preConfirm: () => ({
                    summary:     document.getElementById('print-summary').checked,
                    upcoming:    document.getElementById('print-upcoming').checked,
                    sessions:    document.getElementById('print-sessions').checked,
                    payments:    document.getElementById('print-payments').checked,
                    infractions: document.getElementById('print-infractions').checked,
                    activity:    document.getElementById('print-activity').checked
                })
            });
            if (!isConfirmed) return;

            const rangeLabel = document.getElementById('profile-range-label').innerText;
            let sections = '';

            if (selections.summary) {
                const cell = (v, l) => `<td style="padding:8px;border:1px solid #e5e7eb;text-align:center;"><strong>${esc(v)}</strong><br><span style="font-size:10px;color:#666;">${esc(l)}</span></td>`;
                sections += `
                    <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:24px;"><tr>
                        ${cell(lastStats.gamesPlayed, 'Games Played')}
                        ${cell(lastStats.infractionCount, 'Infractions')}
                        ${cell(lastStats.onTimePct + '%', 'On-Time Payment')}
                        ${cell(lastStats.prepaidLeft, 'Prepaid Left')}
                    </tr></table>`;
            }

            if (selections.upcoming) {
                sections += printTable('Upcoming Sessions', ['Date', 'Time', 'Location', 'Status', 'Payment'],
                    allUpcomingRows.map(r => [formatDateWithDay(r.session_date), timeRange(r.start_time, r.end_time), r.session_location, r.status + (r.session_status === 'Cancelled' ? ' (session cancelled)' : ''), sessionPaymentText(r.session_id).payment]),
                    'No upcoming sessions.');
            }

            if (selections.sessions) {
                sections += printTable('Sessions Played', ['Date', 'Time', 'Location', 'Payment', 'Prepaid'],
                    lastSessionRows.map(h => { const m = sessionPaymentText(h.session_id); return [formatDateWithDay(h.session_date), h.session_time, h.session_location, m.payment, m.prepaid]; }),
                    'No sessions in this range.');
            }

            if (selections.payments) {
                sections += printTable('Payments', ['Paid On', 'Amount', 'Sessions', 'Used', 'Left', 'Forfeited', 'Method'],
                    lastPaymentRows.map(p => { const st = paymentStats(p); return [fmtDate(p.paid_on), money(p.amount), p.sessions_purchased, st.used, st.remaining, st.forfeited, p.payment_method || '']; }),
                    'No pay-ins in this range.');
            }

            if (selections.infractions) {
                sections += printTable('Infraction History', ['Date', 'Type', 'Reason'],
                    lastInfractionRows.map(r => [formatDateWithDay(r.session_date), r.infraction_type, r.reason || '']),
                    'No infractions in this range.');
            }

            if (selections.activity) {
                sections += printTable('Activity', ['When', 'Action', 'Details'],
                    lastActivityRows.map(a => [fmtDateTime(a.created_at), String(a.action).replace(/_/g, ' '), a.details || '']),
                    'No activity in this range.');
            }

            if (!sections) {
                Swal.fire('Nothing Selected', 'Please select at least one section to print.', 'info');
                return;
            }

            document.getElementById('print-only-area').innerHTML = `
                <div style="font-family: sans-serif; padding: 20px;">
                    <h1 style="font-size:18px;margin-bottom:4px;">Player Report: ${esc(currentPlayerName)}</h1>
                    <p style="font-size:11px;color:#666;margin-bottom:16px;">${esc(rangeLabel)} &middot; Generated ${esc(new Date().toLocaleString())}</p>
                    ${sections}
                </div>`;
            window.print();
        }

        document.getElementById('export-csv-btn').addEventListener('click', exportProfileCsv);
        document.getElementById('export-print-btn').addEventListener('click', exportProfilePrint);

        // ---------------------------------------------------------------
        // Load
        // ---------------------------------------------------------------
        (async () => {
            const playerId = new URLSearchParams(window.location.search).get('player');
            if (!playerId) { showError(); return; }

            const today = todayLocal();

            const [
                { data: player, error: playerError },
                { data: history, error: historyError },
                { data: infractions, error: infractionsError },
                { data: registrations, error: registrationsError },
                { data: notes, error: notesError },
                { data: payments, error: paymentsError }
            ] = await Promise.all([
                _supabase.from('players').select('id, name').eq('id', playerId).maybeSingle(),
                _supabase.from('player_session_history').select('*').eq('player_id', playerId).order('session_date', { ascending: false }),
                _supabase.from('view_attendance_infractions').select('*').eq('player_id', playerId).order('session_date', { ascending: false }),
                // All of this player's registrations (any status). player_session_history only
                // has Completed sessions with a Confirmed registration, so Waitlist/Cancelled and
                // upcoming sessions come from here, and it also gives each session's payment status.
                // The date filter is applied in JS: a nested PostgREST filter returns
                // sessions: null instead of dropping the row.
                _supabase.from('registrations')
                    .select('id, status, payment_status, session_id, sessions(id, date, start_time, end_time, location, status)')
                    .eq('player_id', playerId),
                _supabase.from('player_notes').select('*').eq('player_id', playerId).order('created_at', { ascending: false }),
                // Pay-ins with the sessions each one covers (same embeds as admin-payments.html).
                _supabase.from('player_payments')
                    .select('*, payment_registrations(id, registration_id, forfeited_at, infraction_id, sessions(id, date, start_time, end_time, location, status), attendance_infractions(infraction_type, reason))')
                    .eq('player_id', playerId)
                    .order('paid_on', { ascending: false })
                    .order('created_at', { ascending: false })
            ]);

            if (playerError || !player) { showError(); return; }

            // Audit entries: some are logged with player_id, others only with the player's
            // name, so fetch both and merge. Fails soft.
            const [byId, byName] = await Promise.all([
                _supabase.from('audit_logs').select('*').eq('player_id', player.id).order('created_at', { ascending: false }).limit(500),
                _supabase.from('audit_logs').select('*').eq('player_name', player.name).order('created_at', { ascending: false }).limit(500)
            ]);
            const auditMap = new Map();
            [...(byId.error ? [] : (byId.data || [])), ...(byName.error ? [] : (byName.data || []))].forEach(a => auditMap.set(a.id, a));
            allActivity = [...auditMap.values()]
                .filter(a => a.action !== 'UNIQUE_ACCESS')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            currentPlayerName = player.name;
            document.getElementById('manage-notes-link').href = `admin-players.html?edit=${player.id}`;
            document.getElementById('player-name-header').innerText = player.name;
            document.getElementById('nav-title').innerText = player.name;
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('profile-content').classList.remove('hidden');

            renderProfileNotes(notesError ? [] : (notes || []));

            allInfractionRows = infractionsError ? [] : (infractions || []);
            paymentsLoaded = !paymentsError;
            allPayments = paymentsError ? [] : (payments || []);

            const regRows = registrationsError ? [] : (registrations || []);
            const regById = new Map(regRows.map(r => [String(r.session_id), r]));

            allSessionRows = (historyError ? [] : (history || [])).map(h => ({ ...h, reg: h.session_id ? regById.get(String(h.session_id)) : null }));

            allUpcomingRows = regRows
                .filter(r => r.sessions && r.sessions.date >= today && (r.sessions.status === 'Scheduled' || r.sessions.status === 'Cancelled'))
                .map(r => ({
                    reg: r,
                    status: r.status,
                    session_id: r.sessions.id,
                    session_date: r.sessions.date,
                    start_time: r.sessions.start_time,
                    end_time: r.sessions.end_time,
                    session_location: r.sessions.location,
                    session_status: r.sessions.status
                }))
                .sort((a, b) => sessionSortKey({ date: a.session_date, start_time: a.start_time }).localeCompare(sessionSortKey({ date: b.session_date, start_time: b.start_time })));

            buildLookups();

            const lastPlayed = allSessionRows[0];
            document.getElementById('hdr-last-played').innerText = lastPlayed ? formatDateWithDay(lastPlayed.session_date) : '-';
            const nextSession = allUpcomingRows.find(r => r.session_status === 'Scheduled');
            document.getElementById('hdr-next-session').innerText = nextSession ? formatDateWithDay(nextSession.session_date) : '-';

            populateActivityActions();
            renderUpcoming();
            recomputeAndRender();
            updateToggleAllLabel();
        })();
    </script>
</body>
</html>
